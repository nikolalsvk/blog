name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bundlebuddy:
    name: BundleBuddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - name: Caching Gatsby
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public
          key: ${{ runner.os }}-gatsby-site-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gatsby-site-
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      # public/ must exist or Gatsby deletes .cache and reprocesses every image.
      # A warm cache also skips HTML, so those files have to stay. Remove only
      # content-hashed scripts so the report cannot count a chunk from an older build.
      - name: Prepare build directory
        run: |
          mkdir -p public
          find public -maxdepth 1 -type f -regextype posix-extended \
            -regex '.*/(app|framework|webpack-runtime|styles|component---).+-[a-f0-9]{8,}\.js' \
            -delete
          rm -f .cache/bundle-stats.json
      - name: Build
        run: npm run build
        env:
          CI: true
          BUNDLEBUDDY: true
      - name: Report bundle sizes
        run: |
          args=(--path ./public --stats ./.cache/bundle-stats.json --fail-on-budget)
          if [ -n "${PR_NUMBER}" ]; then
            args+=(--pr "${PR_NUMBER}")
          fi
          npx --yes @bundlebuddy/cli@0.1.1 report "${args[@]}"
        env:
          BUNDLEBUDDY_API_KEY: ${{ secrets.BUNDLEBUDDY_API_KEY }}
          BUNDLEBUDDY_PROJECT_ID: ${{ vars.BUNDLEBUDDY_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
